name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Self-hosted only (lenovo-ai-server): GitHub hosts the repository and
    # the issue tracker while all compute runs on that machine. Node is on
    # the runner's PATH, so there is no setup-node and no dependency cache.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          node --version
          npm --version

      # Skip remaining steps if package.json is absent.
      - name: Detect project
        id: detect
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No package.json yet; skipping build."; fi

      - name: npm ci
        if: steps.detect.outputs.present == 'true'
        run: npm ci

      - name: lint
        if: steps.detect.outputs.present == 'true'
        run: npm run --if-present lint

      - name: typecheck
        if: steps.detect.outputs.present == 'true'
        run: npm run --if-present typecheck

      - name: test
        if: steps.detect.outputs.present == 'true'
        run: npm run --if-present test

      # Nothing is uploaded from CI. The loadable builds are committed in
      # dist/chrome-ext and dist/firefox-ext instead.
      - name: build
        if: steps.detect.outputs.present == 'true'
        run: npm run --if-present build

      # The committed builds must match the build from the step above: the
      # step lists any file in dist/ that differs and fails.
      - name: check:dist
        if: steps.detect.outputs.present == 'true'
        run: npm run --if-present check:dist

      - name: check:version
        if: steps.detect.outputs.present == 'true'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          ALLOW_MAJOR_BUMP: ${{ contains(github.event.pull_request.labels.*.name, 'major-release') }}
        run: npm run --if-present check:version

      # web-ext lint on the unpacked Firefox build from the step above.
      - name: lint:firefox
        if: steps.detect.outputs.present == 'true'
        run: npm run --if-present lint:firefox

      # Chrome e2e (see docs/ops.md) on the build from above.
      # Playwright's Chromium is already installed on the runner; screenshots
      # stay in test-results/ on the machine and are not uploaded.
      - name: e2e
        if: steps.detect.outputs.present == 'true'
        run: npm run --if-present e2e
