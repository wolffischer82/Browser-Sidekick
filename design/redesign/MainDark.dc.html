<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidekick chat, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 400px; height: 900px">
  <dc-import name="Main" dark="{{ true }}" accent="{{accent}}" hint-size="400px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2D5BE3","options":["#2D5BE3","#0F766E","#C2410C","#7C3AED"]},"$preview":{"width":400,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2D5BE3' };
  }
}
</script>
</body>
</html>
