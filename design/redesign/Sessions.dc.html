<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sessions drawer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{vars}}">
<div style="position: relative; width: 400px; height: 900px; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 1.45; overflow: hidden">

  <div aria-hidden="true" style="position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; padding: 14px 12px">
    <div style="height: 36px; border-radius: 10px; background: var(--surface)"></div>
    <div style="height: 200px; border-radius: 12px; background: var(--surface)"></div>
    <div style="height: 48px; border-radius: 12px; background: var(--surface)"></div>
    <div style="flex: 1"></div>
    <div style="height: 96px; border-radius: 16px; background: var(--surface)"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(12, 13, 16, 0.42)"></div>

  <aside aria-label="Sessions" style="position: absolute; top: 0; left: 0; bottom: 0; width: 320px; display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--line); box-shadow: 8px 0 32px rgba(0,0,0,.18)">
    <div style="display: flex; align-items: center; gap: 8px; padding: 14px 10px 10px 18px">
      <h2 style="flex: 1; margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em">Sessions</h2>
      <button aria-label="Close" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: transparent; color: var(--muted)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div style="padding: 0 12px 12px">
      <button style="width: 100%; height: 38px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line)); border-radius: 10px; background: var(--accent-soft); color: var(--accent); font: inherit; font-size: 13.5px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>New session</button>
    </div>

    <div style="flex: 1; overflow: hidden; padding: 0 8px; display: flex; flex-direction: column; gap: 2px">
      <div style="padding: 10px 10px 4px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted)">Today</div>
      <button aria-current="true" style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; border-radius: 10px; background: var(--accent-soft); color: var(--ink); font: inherit; text-align: left">
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Rust async runtimes</div>
          <div style="font-size: 12px; color: var(--muted)">2 min ago · 4 pins</div>
        </div>
        <span style="width: 7px; height: 7px; border-radius: 50%; background: var(--accent)"></span>
      </button>
      <div style="display: flex; align-items: center; gap: 10px; padding: 9px 4px 9px 10px; border-radius: 10px; background: var(--sunken)">
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Flat hunting in Leipzig</div>
          <div style="font-size: 12px; color: var(--muted)">3 h ago · 6 pins</div>
        </div>
        <button aria-label="Delete “Flat hunting in Leipzig”" style="width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: var(--muted)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
      </div>

      <div style="padding: 14px 10px 4px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted)">This week</div>
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px; margin: 2px 0; border: 1px solid color-mix(in srgb, var(--red) 35%, var(--line)); border-radius: 12px; background: color-mix(in srgb, var(--red) 5%, var(--surface))">
        <div>
          <div style="font-size: 13.5px; font-weight: 600">Postgres indexing</div>
          <div style="font-size: 12.5px; color: var(--muted)">Delete this session with its pins and messages?</div>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px">
          <button style="height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; font-weight: 500">Cancel</button>
          <button style="height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: var(--red); color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600">Delete</button>
        </div>
      </div>
      <button style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); font: inherit; text-align: left">
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Side panel API notes</div>
          <div style="font-size: 12px; color: var(--muted)">2 days ago · 3 pins</div>
        </div>
      </button>
      <button style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); font: inherit; text-align: left">
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Espresso grinders compared</div>
          <div style="font-size: 12px; color: var(--muted)">4 days ago · 5 pins</div>
        </div>
      </button>

      <div style="padding: 14px 10px 4px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted)">Earlier</div>
      <button style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); font: inherit; text-align: left">
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">New session</div>
          <div style="font-size: 12px; color: var(--muted)">3 weeks ago · 1 pin</div>
        </div>
      </button>
      <button style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); font: inherit; text-align: left">
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Trip planning: Lisbon</div>
          <div style="font-size: 12px; color: var(--muted)">Aug 14 · 9 pins</div>
        </div>
      </button>
    </div>
  </aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#2D5BE3","options":["#2D5BE3","#0F766E","#C2410C","#7C3AED"]},"$preview":{"width":400,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const accent = this.props.accent ?? '#2D5BE3';
    const L = { bg: '#F6F6F3', surface: '#FFFFFF', sunken: '#EFEFEB', ink: '#17181B', muted: '#5D616A', line: '#E4E4DF', green: '#1E7A46', amber: '#7A5300', amberSoft: '#FBF0D9', red: '#B42318', shadow: '0 1px 2px rgba(20,20,25,.05), 0 6px 20px rgba(20,20,25,.06)' };
    const D = { bg: '#111214', surface: '#1A1B1E', sunken: '#24252A', ink: '#ECEDEF', muted: '#A2A6AE', line: '#2D2F35', green: '#6FCF97', amber: '#F1C96B', amberSoft: '#3A2F14', red: '#F97066', shadow: '0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3)' };
    const t = dark ? D : L;
    const acc = dark ? 'color-mix(in srgb, ' + accent + ' 55%, #ffffff)' : accent;
    const vars = '--bg:' + t.bg + ';--surface:' + t.surface + ';--sunken:' + t.sunken + ';--ink:' + t.ink + ';--muted:' + t.muted + ';--line:' + t.line + ';--green:' + t.green + ';--amber:' + t.amber + ';--amber-soft:' + t.amberSoft + ';--red:' + t.red + ';--shadow:' + t.shadow + ';--accent:' + acc + ';--accent-soft:color-mix(in srgb, ' + acc + ' ' + (dark ? 16 : 9) + '%, ' + t.surface + ');--on-accent:' + (dark ? '#0E1013' : '#FFFFFF') + ';width:400px;height:900px';
    return { vars };
  }
}
</script>
</body>
</html>
